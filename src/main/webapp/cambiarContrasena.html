<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/restore.css">
</head>
<body>

<div class="container">

    <section class="left-panel">

        <div class="logo">
            <a class="brand" href="index.html">Event Online</a>
        </div>

        <div class="hero-content">
            <h1>
                Recupera tu acceso de forma segura.
            </h1>

            <p>
                Restablece tu contraseña y vuelve a gestionar eventos,
                proveedores y experiencias memorables desde un solo lugar.
            </p>
        </div>

    </section>

    <section class="right-panel">

        <div class="card">

            <h2>Restablecer contraseña</h2>

            <p class="subtitle">
                Ingresa la contraseña nueva. Asegurate de no olvidarla.
            </p>

            <form id="resetForm" action="codigoVerificacion.html">

                <div class="input-group">
                    <label for="new-password">Nueva contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" name="password" placeholder="••••••••" required />
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>

                        </button>
                    </div>
                </div>

                <button  type="submit" class="btn-primary">
                    Guardar nueva contraseña
                </button>

            </form>



            <div class="login-link">
                ¿Ya recordaste tu contraseña?
                <a href="login.jsp">Iniciar sesión</a>
            </div>

        </div>

    </section>

</div>

<script src="assets/js/restore.js"></script>

</body>
</html>
