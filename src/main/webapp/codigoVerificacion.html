<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Código - Event Online</title>

    <link rel="stylesheet" href="assets/css/codigoVerificacion.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <section class="left-panel">
        <div class="overlay"></div>

        <div class="logo">
            <a href="index.html">Event Online</a>
        </div>

        <div class="content">
            <h1>Verifica tu identidad de forma segura</h1>
            <p>
                Hemos enviado un código de recuperación a tu correo electrónico.
                Ingresa el código para continuar con el restablecimiento de tu cuenta.
            </p>
        </div>
    </section>

    <section class="right-panel">
        <div class="card">
            <h2>Confirmar código</h2>
            <p class="subtitle">Ingresa el código de 6 dígitos a continuación</p>

            <div class="code-container">
                <input type="text" maxlength="1" autofocus>
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>

            <button class="btn">Enviar código</button>

            <div class="footer-links">
                ¿No recibiste código? <a href="#">Reenviar código</a>
            </div>
        </div>
    </section>

</div>

</body>
</html>
