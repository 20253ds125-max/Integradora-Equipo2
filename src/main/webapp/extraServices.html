<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Extra | Event Online</title>

    <link rel="stylesheet" href="assets/css/services.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="catalog-header">
    <div class="brand-group">
        <a class="brand" href="index.jsp">Event Online</a>
    </div>

    <nav class="top-nav" aria-label="Navegación">
        <a href="WEB-INF/catalogo.jsp">Recintos</a>
        <a class="active" href="extraServices.html">Servicios</a>
        <a href="perfil.html">Perfil</a>
    </nav>

    <div class="header-actions">
        <a class="host-button" href="publicarServicio.html">Publicar servicio</a>
    </div>
</header>

<section class="catalogo-servicios">
    <aside class="sidebar">
        <input
                type="text"
                id="buscador"
                placeholder="Buscar en ciudad o región"
        >

        <div class="grupo-filtro">
            <h3>Localidad</h3>

            <div class="filter-options">
                <button class="filtro activo" data-localidad="todas" type="button">Todas</button>
                <button class="filtro" data-localidad="cdmx" type="button">CDMX</button>
                <button class="filtro" data-localidad="san-miguel" type="button">San Miguel</button>
                <button class="filtro" data-localidad="tulum" type="button">Tulum</button>
                <button class="filtro" data-localidad="merida" type="button">Mérida</button>
                <button class="filtro" data-localidad="cabos" type="button">Los Cabos</button>
            </div>
        </div>

        <div class="grupo-filtro">
            <h3>Categoría</h3>

            <div class="filter-options">
                <button class="filtro activo" data-categoria="todos" type="button">Todos</button>
                <button class="filtro" data-categoria="musica" type="button">Música</button>
                <button class="filtro" data-categoria="catering" type="button">Catering</button>
                <button class="filtro" data-categoria="decoracion" type="button">Decoración</button>
                <button class="filtro" data-categoria="foto" type="button">Fotografía</button>
                <button class="filtro" data-categoria="video" type="button">Video</button>
                <button class="filtro" data-categoria="dj" type="button">DJ</button>
                <button class="filtro" data-categoria="musica-en-vivo" type="button">Música en vivo</button>
                <button class="filtro" data-categoria="iluminacion" type="button">Iluminación</button>
            </div>
        </div>
    </aside>

    <main class="contenido">
        <div class="encabezado">
            <h1>Servicios Extra</h1>
            <p>Complementa tu evento con experiencias únicas</p>
        </div>

        <div class="grid-servicios" id="contenedorServicios"></div>
    </main>
</section>

<script src="assets/js/evento.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/services.js"></script>

<footer class="main-footer">© 2026 Event Online. Todos los derechos reservados.</footer>

</body>
</html>
